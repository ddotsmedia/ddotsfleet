packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  prisma: true
  "@prisma/engines": true
  "@swc/core": true
  unrs-resolver: true
  "@parcel/watcher": true
  msgpackr-extract: true
  esbuild: true
  "@scarf/scarf": false

minimumReleaseAgeExclude:
  - "@sentry/browser-utils@11.8.0"
  - "@sentry/browser@11.8.0"
  - "@sentry/bundler-plugins@11.8.0"
  - "@sentry/cloudflare@11.8.0"
  - "@sentry/core@11.8.0"
  - "@sentry/feedback@11.8.0"
  - "@sentry/nextjs@11.8.0"
  - "@sentry/node@11.8.0"
  - "@sentry/opentelemetry@11.8.0"
  - "@sentry/react@11.8.0"
  - "@sentry/replay-canvas@11.8.0"
  - "@sentry/replay@11.8.0"
  - "@sentry/server-runtime-injection@11.8.0"
  - "@sentry/server-utils@11.8.0"
  - "@sentry/vercel-edge@11.8.0"
  - "@tanstack/query-core@5.104.3"
  - "@tanstack/react-query@5.104.3"
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - vitest@5.0.5
overrides:
  "rollup": "4.64.6"
  "@rollup/rollup-android-arm-eabi": "4.64.6"
  "@rollup/rollup-android-arm64": "4.64.6"
  "@rollup/rollup-darwin-arm64": "4.64.6"
  "@rollup/rollup-darwin-x64": "4.64.6"
  "@rollup/rollup-freebsd-arm64": "4.64.6"
  "@rollup/rollup-freebsd-x64": "4.64.6"
  "@rollup/rollup-linux-arm-gnueabihf": "4.64.6"
  "@rollup/rollup-linux-arm-musleabihf": "4.64.6"
  "@rollup/rollup-linux-arm64-gnu": "4.64.6"
  "@rollup/rollup-linux-arm64-musl": "4.64.6"
  "@rollup/rollup-linux-loong64-gnu": "4.64.6"
  "@rollup/rollup-linux-loong64-musl": "4.64.6"
  "@rollup/rollup-linux-ppc64-gnu": "4.64.6"
  "@rollup/rollup-linux-ppc64-musl": "4.64.6"
  "@rollup/rollup-linux-riscv64-gnu": "4.64.6"
  "@rollup/rollup-linux-riscv64-musl": "4.64.6"
  "@rollup/rollup-linux-s390x-gnu": "4.64.6"
  "@rollup/rollup-linux-x64-gnu": "4.64.6"
  "@rollup/rollup-linux-x64-musl": "4.64.6"
  "@rollup/rollup-openbsd-x64": "4.64.6"
